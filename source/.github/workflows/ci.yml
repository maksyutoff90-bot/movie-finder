name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Линтер
        run: ruff check .
      - name: Типы
        run: mypy

  tests:
    # GUI-тесты открывают окна Tk, поэтому Windows и отдельный прогон без них.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Тесты без интерфейса
        run: python -m pytest -m "not gui" --cov=movie_search --cov-report=term-missing
